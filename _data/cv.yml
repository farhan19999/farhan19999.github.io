  summary: Research-oriented software engineer with a B.Sc. in Computer Science and Engineering from Bangladesh University of Engineering and Technology (BUET), interested in trustworthy AI, LLM-assisted security analysis, formal methods, federated learning, privacy-preserving machine learning, IoT security, and systems. Research experience includes systematic vulnerability analysis of the Matter SDK using LLM-generated formal models, federated learning for privacy-preserving crime prediction, and LLM-based text representation for personality classification. Professional experience includes Tizen SDK development, QEMU-based emulator performance improvement, Rust-based developer tooling, and AI agent development at Samsung R&D Institute Bangladesh.

